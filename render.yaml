services:
  - type: web
    name: hopehive-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: hopehive
      - key: CLIENT_URL
        sync: false
      - key: AUTH_BASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Dhaka
